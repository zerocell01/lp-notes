<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d8cff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2ee6d5" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee6d5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lg3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ba4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9d8cff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ng1"><stop offset="0%" stop-color="#9d8cff"/><stop offset="100%" stop-color="#5ba4ff"/></radialGradient>
    <radialGradient id="ng2"><stop offset="0%" stop-color="#2ee6d5"/><stop offset="100%" stop-color="#9d8cff"/></radialGradient>
    <radialGradient id="ng3"><stop offset="0%" stop-color="#ff7eb3"/><stop offset="100%" stop-color="#ffc44d"/></radialGradient>
    <radialGradient id="ng4"><stop offset="0%" stop-color="#5ba4ff"/><stop offset="100%" stop-color="#2ee6d5"/></radialGradient>
    <radialGradient id="ng5"><stop offset="0%" stop-color="#9d8cff"/><stop offset="100%" stop-color="#ff7eb3"/></radialGradient>
  </defs>

  <!-- Dashed connection lines -->
  <g stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="50" y1="100" x2="130" y2="70" stroke="url(#lg1)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="50" y1="100" x2="130" y2="130" stroke="url(#lg1)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="0.3s"/></line>
    <line x1="130" y1="70" x2="210" y2="100" stroke="url(#lg2)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="0.6s"/></line>
    <line x1="130" y1="130" x2="210" y2="100" stroke="url(#lg2)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="0.15s"/></line>
    <line x1="210" y1="100" x2="290" y2="60" stroke="url(#lg3)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="0.9s"/></line>
    <line x1="210" y1="100" x2="290" y2="140" stroke="url(#lg3)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="0.45s"/></line>
    <line x1="290" y1="60" x2="360" y2="100" stroke="url(#lg1)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="0.75s"/></line>
    <line x1="290" y1="140" x2="360" y2="100" stroke="url(#lg1)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2.5s" repeatCount="indefinite" begin="1.05s"/></line>
  </g>

  <!-- Nodes with opacity pulse -->
  <rect x="25" y="75" width="50" height="50" rx="10" fill="url(#ng1)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="105" y="45" width="50" height="50" rx="10" fill="url(#ng2)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <rect x="105" y="105" width="50" height="50" rx="10" fill="url(#ng3)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <rect x="185" y="75" width="50" height="50" rx="10" fill="url(#ng4)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="265" y="35" width="50" height="50" rx="10" fill="url(#ng5)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
  </rect>
  <rect x="265" y="115" width="50" height="50" rx="10" fill="url(#ng1)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.7s" repeatCount="indefinite" begin="1.2s"/>
  </rect>
  <rect x="335" y="75" width="50" height="50" rx="10" fill="url(#ng2)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" begin="0.6s"/>
  </rect>

  <!-- Labels -->
  <g fill="#fff" font-size="9" font-weight="700" font-family="monospace" text-anchor="middle">
    <text x="50" y="104">BLK</text>
    <text x="130" y="74">TX</text>
    <text x="130" y="134">SC</text>
    <text x="210" y="104">DeFi</text>
    <text x="290" y="64">NFT</text>
    <text x="290" y="144">LP</text>
    <text x="360" y="104">dApp</text>
  </g>

  <!-- X Profile card -->
  <g transform="translate(130, 220)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(157,140,255,0.3)" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <svg viewBox="0 0 16 16" width="16" height="16">
        <path d="M1.5 1L6.4 8.4 1.3 15h1.2l4.4-5.5L10.3 15h4.2L9.2 7.2 14 1h-1.2L8.7 6.2 5.7 1H1.5z" fill="#9d8cff"/>
      </svg>
    </g>
    <text x="38" y="20" fill="#9d8cff" font-size="10" font-weight="600" font-family="sans-serif">@anantachill</text>
    <text x="38" y="33" fill="rgba(255,255,255,0.5)" font-size="8" font-family="sans-serif">Web3 Learner</text>
  </g>
</svg>
